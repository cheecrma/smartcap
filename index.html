<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<title>스마트캡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#E9EEF4; --sheet:#FFFFFF; --ink:#13202F; --muted:#5A6878; --line:#CBD5E0;
  --hud:#FFCE3A; --hud-ink:#1A1400; --chip:#F1F4F8; --field:#F7F9FB;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1726; --sheet:#16212F; --ink:#E8EEF5; --muted:#93A2B3; --line:#2A3A4D; --chip:#1E2B3B; --field:#101A26; }
}
:root[data-theme="dark"]{ --bg:#0E1726; --sheet:#16212F; --ink:#E8EEF5; --muted:#93A2B3; --line:#2A3A4D; --chip:#1E2B3B; --field:#101A26; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hud);outline-offset:2px}
a{color:inherit}

#setup{position:fixed;inset:0;overflow:auto;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
.sheet{width:100%;max-width:440px;background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:28px 22px 22px}
.mark{display:flex;gap:12px;align-items:center;margin-bottom:6px}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
.lead{color:var(--muted);margin:10px 0 24px;line-height:1.6;font-size:15px}
fieldset{border:0;margin:0 0 20px;padding:0}
legend,.lbl{font-weight:600;font-size:15px;margin-bottom:10px;display:block}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--hud);box-shadow:inset 0 0 0 1px var(--hud)}
.opt input{margin-top:4px;accent-color:#E0A800}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:13px;line-height:1.5}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 12px}
.keyrow button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:0 14px;cursor:pointer}
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 20px}
.go{width:100%;border:0;border-radius:14px;padding:16px;background:var(--hud);color:var(--hud-ink);font-weight:700;font-size:17px;cursor:pointer}
.err{color:#D9443A;font-size:14px;margin-top:12px;line-height:1.5;min-height:1em}

#live{position:fixed;inset:0;background:#000;display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
video{display:none}
#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,10,18,.85) 35%);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:10px}
#mic{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--hud);color:var(--hud-ink);display:grid;place-items:center;cursor:pointer}
#mic.on{background:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,206,58,.25)}}
@media (prefers-reduced-motion: reduce){#mic.on{animation:none}}
#q{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);padding:0 12px;color:#fff}
#q::placeholder{color:rgba(255,255,255,.55)}
.t{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:#fff}
.t[aria-pressed="true"]{background:var(--hud);color:var(--hud-ink);border-color:var(--hud)}
.scroll{overflow-x:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
#safe{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(10,16,26,.9);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="safe"></div>
<div id="toast" role="status"></div>

<section id="setup">
  <div class="sheet">
    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 26c0-9 7-16 16-16s16 7 16 16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M4 27h36c0 0-2 4-8 4H4z" fill="#FFCE3A"/><circle cx="22" cy="18" r="3" fill="#FFCE3A"/></svg>
      <h1>스마트캡</h1>
    </div>
    <p class="lead">물어보는 순간의 화면을 찍어서 AI에게 보여 주고, 본 것에 대해 대답을 들려줍니다. 가운데 조준점에 맞춘 물건이 "이것"이고, 화면을 잠깐 멈추면 물체마다 색 테두리가 생겨서 "빨간 거 뭐야?"처럼 물어볼 수 있어요.</p>

    <fieldset>
      <legend>AI 엔진</legend>
      <label class="opt"><input type="radio" name="engine" value="local" checked><span><b>폰 내장 (Hugging Face)</b><small>FastVLM 0.5B로 답하고 Florence-2로 윤곽을 찾음. 인터넷, 키, 비용 없음. 처음 한 번 수백 MB 받기</small></span></label>
      <label class="opt"><input type="radio" name="engine" value="gemini"><span><b>Gemini</b><small>더 똑똑하고 한국어가 자연스러움. API 키 필요</small></span></label>
    </fieldset>

    <div id="geminiOpts">
    <label class="lbl" for="key">Gemini API 키</label>
    <div class="keyrow">
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza로 시작하는 키">
      <button id="showKey" type="button">보기</button>
    </div>
    <p class="hint">키는 이 기기 브라우저에만 저장되고, 사진은 구글 서버로만 전송돼요. 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 만들 수 있어요.</p>

    <fieldset>
      <legend>AI 모델</legend>
      <label class="opt"><input type="radio" name="model" value="gemini-3.5-flash-lite" checked><span><b>빠름</b><small>Gemini 3.5 Flash-Lite. 대답이 가장 빠르고 저렴함</small></span></label>
      <label class="opt"><input type="radio" name="model" value="gemini-3.6-flash"><span><b>똑똑함</b><small>Gemini 3.6 Flash. 글자 읽기, 복잡한 질문에 더 강함</small></span></label>
    </fieldset>
    </div>

    <fieldset>
      <legend>화면 방식</legend>
      <label class="opt"><input type="radio" name="view" value="mono" checked><span><b>한 화면</b><small>손에 들고 테스트하거나 렌즈 하나짜리 틀에 쓸 때</small></span></label>
      <label class="opt"><input type="radio" name="view" value="stereo"><span><b>양안 분할</b><small>렌즈 두 개짜리 헤드셋 틀용. 탭하면 말하기, 길게 누르면 메뉴</small></span></label>
    </fieldset>

    <button class="go" id="go">카메라 켜고 시작</button>
    <div class="err" id="err"></div>
  </div>
</section>

<section id="live">
  <video id="v" playsinline muted></video>
  <canvas id="cv" aria-label="카메라 화면과 AI 안내"></canvas>
  <div id="bar">
    <div class="row">
      <button id="mic" aria-label="말하기"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
      <input id="q" placeholder="보이는 것에 대해 물어보기" enterkeyhint="send" autocomplete="off">
    </div>
    <div class="row scroll">
      <button class="t" id="look">이게 뭐야?</button>
      <button class="t" id="read">글자 읽어줘</button>
      <button class="t" id="outline" aria-pressed="true">윤곽 표시</button>
      <button class="t" id="rescan">윤곽 다시 찾기</button>
      <button class="t" id="hf" aria-pressed="false">핸즈프리</button>
      <button class="t" id="voice" aria-pressed="true">음성 답변</button>
      <button class="t" id="stereoBtn" aria-pressed="false">양안 분할</button>
      <button class="t" id="flip">카메라 전환</button>
      <button class="t" id="back">설정</button>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const video = $('#v'), cv = $('#cv'), ctx = cv.getContext('2d');
const S = {
  stream:null, facing:'environment', key:'', model:'', engine:'local', ai:'', user:'', status:'',
  busy:false, listening:false, speaking:false, handsfree:false, voiceOn:true, stereo:false,
  history:[], rec:null, finalText:'', dpr:1, safeTop:0, running:false, snap:null, snapAt:0, flash:0, thinkOff:false,
  outlineOn:true, boxes:[], ref:null, prev:null, off:{x:0,y:0}, cur:{x:0,y:0}, disp:{x:0,y:0}, stale:false, staleAt:0,
  steadySince:0, scanning:false, lastScan:0, scanPausedUntil:0, boxBorn:0, forceScan:false
};
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
$('#key').value = store.get('smartcap.key');
const savedModel = store.get('smartcap.model');
if(savedModel){ const r = document.querySelector(`input[name=model][value="${savedModel}"]`); if(r) r.checked = true; }
const savedEngine = store.get('smartcap.engine');
if(savedEngine){ const r = document.querySelector(`input[name=engine][value="${savedEngine}"]`); if(r) r.checked = true; }
function syncEngineUI(){ $('#geminiOpts').style.display = document.querySelector('input[name=engine]:checked').value === 'gemini' ? 'block' : 'none'; }
document.querySelectorAll('input[name=engine]').forEach(r => r.addEventListener('change', syncEngineUI)); syncEngineUI();
$('#showKey').onclick = () => { const k = $('#key'); k.type = k.type === 'password' ? 'text' : 'password'; $('#showKey').textContent = k.type === 'password' ? '보기' : '숨기기'; };

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),2600); }

/* ---------- start ---------- */
$('#go').onclick = async () => {
  $('#err').textContent = '';
  S.engine = document.querySelector('input[name=engine]:checked').value;
  S.key = $('#key').value.trim();
  if(S.engine === 'gemini' && !S.key){ $('#err').textContent = 'Gemini API 키를 넣어 주세요.'; return; }
  if(S.engine === 'local' && !navigator.gpu){ $('#err').textContent = '이 브라우저는 WebGPU를 지원하지 않아서 폰 내장 AI를 쓸 수 없어요. 최신 크롬으로 열거나 Gemini를 골라 주세요.'; return; }
  store.set('smartcap.engine', S.engine);
  S.model = document.querySelector('input[name=model]:checked').value;
  S.stereo = document.querySelector('input[name=view]:checked').value === 'stereo';
  store.set('smartcap.key', S.key); store.set('smartcap.model', S.model);
  try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch(e){}
  try { await openCamera(); }
  catch(e){ $('#err').textContent = '카메라를 열지 못했어요. 카메라 권한을 허용하고, 다른 앱이 카메라를 쓰고 있지 않은지 확인해 주세요. (' + e.name + ')'; return; }
  $('#setup').style.display = 'none'; $('#live').style.display = 'block';
  try { await document.documentElement.requestFullscreen?.(); } catch(e){}
  try { await navigator.wakeLock?.request('screen'); } catch(e){}
  if(S.engine === 'local'){ if(!LOCAL.started) loadLocal(); else S.status = LOCAL.ready ? '폰 내장 AI' : S.status; }
  else S.status = S.model.includes('lite') ? 'Flash-Lite' : 'Flash';
  S.boxes = []; S.ref = null;
  applyStereo(); resize();
  if(!S.running){ S.running = true; requestAnimationFrame(render); }
  if(!S.motionTimer) S.motionTimer = setInterval(motionTick, 66);
};

async function openCamera(){
  S.stream?.getTracks().forEach(t=>t.stop());
  S.stream = await navigator.mediaDevices.getUserMedia({ audio:false,
    video:{ facingMode:{ideal:S.facing}, width:{ideal:1920}, height:{ideal:1080} } });
  video.srcObject = S.stream; await video.play();
}
function applyStereo(){
  $('#stereoBtn').setAttribute('aria-pressed', S.stereo);
  $('#bar').style.display = S.stereo ? 'none' : 'block';
  if(S.stereo){ try{ screen.orientation?.lock?.('landscape').catch(()=>{}); }catch(e){} toast('탭하면 말하기, 길게 누르면 메뉴'); }
  else { try{ screen.orientation?.unlock?.(); }catch(e){} }
}
function resize(){
  S.dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * S.dpr); cv.height = Math.round(innerHeight * S.dpr);
  S.safeTop = parseFloat(getComputedStyle($('#safe')).paddingTop) || 0;
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && S.running){ try{ await navigator.wakeLock?.request('screen'); }catch(e){} }
});

/* ---------- capture the moment you ask ---------- */
function capture(annotate){
  const vw = video.videoWidth, vh = video.videoHeight; if(!vw) return null;
  const k = Math.min(1, 1024 / Math.max(vw, vh)), c = document.createElement('canvas');
  c.width = Math.round(vw*k); c.height = Math.round(vh*k);
  const g = c.getContext('2d');
  g.drawImage(video, 0, 0, c.width, c.height);
  if(annotate){
    g.lineWidth = Math.max(3, c.width/260);
    for(const o of S.boxes){
      const [x,y,w,h] = boxNow(o).map(v => v*k);
      g.strokeStyle = o.color.hex; roundRect(x, y, w, h, Math.min(w,h)*0.08, g); g.stroke();
    }
  }
  S.snap = c; S.snapAt = performance.now(); S.flash = performance.now();
  return c.toDataURL('image/jpeg', 0.82).split(',')[1];
}
function smallCanvas(max){
  const vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, max / Math.max(vw, vh));
  const c = document.createElement('canvas'); c.width = Math.round(vw*k); c.height = Math.round(vh*k);
  c.getContext('2d', { willReadFrequently:true }).drawImage(video, 0, 0, c.width, c.height);
  return c;
}

/* ---------- on-device engine: Hugging Face models via Transformers.js ---------- */
const HF_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js';
const VLM_ID = 'onnx-community/FastVLM-0.5B-ONNX';
const OD_ID = 'onnx-community/Florence-2-base-ft';
let HF = null;
const LOCAL = { started:false, ready:false, odReady:false, vlm:null, vproc:null, od:null, oproc:null };
const dl = new Map();
function onProgress(p){
  if(p.status !== 'progress' || !p.total) return;
  dl.set(p.name + '/' + p.file, { l:p.loaded, t:p.total });
  let l = 0, t = 0; for(const v of dl.values()){ l += v.l; t += v.t; }
  S.status = `AI 받는 중 ${Math.round(l/t*100)}%`;
}
// one model at a time on the GPU
let gpuChain = Promise.resolve();
function gpu(fn){ const p = gpuChain.then(fn, fn); gpuChain = p.catch(() => {}); return p; }

// try 4-bit first (small, fast); if this phone's GPU can't run it, fall back to fp16
const VLM_DTYPES = [
  { label:'q4', dtype:{ embed_tokens:'fp16', vision_encoder:'q4', decoder_model_merged:'q4' } },
  { label:'fp16', dtype:{ embed_tokens:'fp16', vision_encoder:'fp16', decoder_model_merged:'fp16' } }
];
const OD_DTYPES = [
  { label:'q4', dtype:{ embed_tokens:'fp16', vision_encoder:'fp16', encoder_model:'q4', decoder_model_merged:'q4' } },
  { label:'fp16', dtype:{ embed_tokens:'fp16', vision_encoder:'fp16', encoder_model:'fp16', decoder_model_merged:'fp16' } }
];
function testCanvas(){
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const g = c.getContext('2d', { willReadFrequently:true }); g.fillStyle = '#888'; g.fillRect(0,0,96,96); g.fillStyle = '#fff'; g.fillRect(30,30,36,36);
  return c;
}
async function loadWithFallback(name, Cls, id, options, test){
  let lastErr;
  for(const opt of options){
    let model = null;
    try{
      dl.clear(); S.status = `${name} 준비 중 (${opt.label})`;
      model = await Cls.from_pretrained(id, { device:'webgpu', dtype:opt.dtype, progress_callback:onProgress });
      S.status = `${name} 시험 실행 중`;
      await test(model);                         // run once for real; this is where GPU kernel errors show up
      LOCAL.mode[name] = opt.label;
      return model;
    }catch(e){
      console.warn(name, opt.label, e); lastErr = e;
      try{ await model?.dispose?.(); }catch(_){}
      if(opt !== options.at(-1)) toast(`${name}: ${opt.label} 방식이 이 폰에서 안 돼서 다른 방식으로 다시 받아요`);
    }
  }
  throw lastErr;
}
async function loadLocal(){
  LOCAL.started = true; LOCAL.mode = {}; S.status = 'AI 준비 중';
  try{
    HF = await import(HF_URL);
    LOCAL.vproc = await HF.AutoProcessor.from_pretrained(VLM_ID);
    LOCAL.vlm = await gpu(() => loadWithFallback('답변 AI', HF.AutoModelForImageTextToText, VLM_ID, VLM_DTYPES,
      async m => { LOCAL.vlm = m; await localVlm(testCanvas(), 'What color is the square?', null, 4); }));
    LOCAL.ready = true; S.status = '폰 내장 AI';
    toast('답변 AI 준비 완료. 윤곽 모델도 이어서 받아요');
  }catch(e){ console.error(e); LOCAL.vlm = null; S.status = 'AI 불러오기 실패'; S.ai = '답변 AI를 이 폰에서 실행하지 못했어요. ' + shortErr(e); return; }
  try{
    LOCAL.oproc = await HF.AutoProcessor.from_pretrained(OD_ID);
    LOCAL.od = await gpu(() => loadWithFallback('윤곽 AI', HF.Florence2ForConditionalGeneration, OD_ID, OD_DTYPES,
      async m => { LOCAL.od = m; await localDetect(testCanvas()); }));
    LOCAL.odReady = true; S.status = '폰 내장 AI';
    toast('윤곽 AI도 준비됐어요. 화면을 잠깐 멈춰 보세요');
  }catch(e){ console.error(e); LOCAL.od = null; S.status = '폰 내장 AI'; toast('윤곽 AI를 이 폰에서 실행하지 못했어요'); }
}
function shortErr(e){ const m = String(e?.message || e); return m.length > 120 ? m.slice(0, 120) + '...' : m; }
async function localVlm(canvas, text, onText, max = 160){
  const image = HF.RawImage.fromCanvas(canvas);
  const prompt = LOCAL.vproc.apply_chat_template([{ role:'user', content:'<image>' + text }], { add_generation_prompt:true });
  const inputs = await LOCAL.vproc(image, prompt, { add_special_tokens:false });
  let out = '';
  const streamer = new HF.TextStreamer(LOCAL.vproc.tokenizer, {
    skip_prompt:true, skip_special_tokens:true,
    callback_function: t => { out += t; onText?.(out); }
  });
  await LOCAL.vlm.generate({ ...inputs, max_new_tokens:max, do_sample:false, repetition_penalty:1.15, streamer });
  return out.trim();
}
async function localDetect(canvas){
  const image = HF.RawImage.fromCanvas(canvas), task = '<OD>';
  const inputs = await LOCAL.oproc(image, task);
  const ids = await LOCAL.od.generate({ ...inputs, max_new_tokens:256 });
  const text = LOCAL.oproc.tokenizer.batch_decode(ids, { skip_special_tokens:false })[0];
  const r = LOCAL.oproc.post_process_generation(text, task, [image.width, image.height])[task] || { bboxes:[], labels:[] };
  return (r.bboxes || []).map((b,i) => ({ x0:b[0], y0:b[1], x1:b[2], y1:b[3], label:r.labels[i] || '' }));
}

/* ---------- color outlines: Gemini finds objects, the phone keeps them in place ---------- */
const COLORS = [
  {name:'빨강', hex:'#FF453A'}, {name:'파랑', hex:'#3D8BFF'}, {name:'초록', hex:'#30D158'},
  {name:'노랑', hex:'#FFD60A'}, {name:'보라', hex:'#BF5AF2'}, {name:'분홍', hex:'#FF6EC7'}
];
const COLOR_EN = { '빨강':'red', '파랑':'blue', '초록':'green', '노랑':'yellow', '보라':'purple', '분홍':'pink' };
const COLOR_RE = /(빨강|빨간|붉은|파랑|파란|초록|녹색|노랑|노란|보라|분홍|핑크|테두리)/;
const SCAN_MODEL = 'gemini-3.5-flash-lite';
const SCAN_PROMPT = `사진에서 사람이 궁금해할 만한 뚜렷한 물체를 최대 6개 찾아. 물건, 식물, 꽃, 나무, 동물, 간판, 기기, 음식 등.
벽, 바닥, 천장, 하늘, 길바닥 같은 배경과 너무 작은 것은 빼.
JSON 배열만 출력해: [{"box_2d":[ymin,xmin,ymax,xmax],"label":"짧은 한국어 이름"}]. 좌표는 0~1000으로 정규화해.`;

// tiny grayscale frames for cheap motion tracking
const TW = 96; let TH = 0;
const tc = document.createElement('canvas'), tctx = tc.getContext('2d', { willReadFrequently:true });
function grabTiny(){
  tctx.drawImage(video, 0, 0, TW, TH);
  const d = tctx.getImageData(0, 0, TW, TH).data, g = new Uint8Array(TW*TH);
  for(let i=0, j=0; i<g.length; i++, j+=4) g[i] = (d[j]*77 + d[j+1]*150 + d[j+2]*29) >> 8;
  return g;
}
function meanDiff(a, b){
  let s = 0, n = 0;
  for(let i=0; i<a.length; i+=3){ s += Math.abs(a[i]-b[i]); n++; }
  return s/n;
}
const R = 10;
function estimateShift(ref, cur){
  let best = {dx:0, dy:0, err:1e9};
  for(let dy=-R; dy<=R; dy++) for(let dx=-R; dx<=R; dx++){
    let s = 0, n = 0;
    for(let y=R; y<TH-R; y+=2){
      const ro = y*TW, co = (y+dy)*TW + dx;
      for(let x=R; x<TW-R; x+=2){ s += Math.abs(ref[ro+x] - cur[co+x]); n++; }
    }
    s /= n; if(s < best.err) best = {dx, dy, err:s};
  }
  return best;
}
function motionTick(){
  if(!video.videoWidth || document.hidden || $('#live').style.display === 'none') return;
  if(!TH){ TH = Math.round(TW*video.videoHeight/video.videoWidth); tc.width = TW; tc.height = TH; }
  const now = performance.now(), g = grabTiny();
  if(S.prev){
    if(meanDiff(S.prev, g) < 6){ if(!S.steadySince) S.steadySince = now; } else S.steadySince = 0;
  }
  S.prev = g;
  if(S.ref && S.boxes.length && !S.stale){
    const r = estimateShift(S.ref, g);
    if(r.err > 24 || Math.abs(r.dx) >= R || Math.abs(r.dy) >= R){ S.stale = true; S.staleAt = now; }
    else if(Math.abs(r.dx) > 4 || Math.abs(r.dy) > 4){
      S.off.x += r.dx; S.off.y += r.dy; S.ref = g; S.cur = {x:S.off.x, y:S.off.y};     // re-anchor so tracking can go further
    } else S.cur = {x:S.off.x + r.dx, y:S.off.y + r.dy};
    if(Math.abs(S.off.x) > TW*0.4 || Math.abs(S.off.y) > TH*0.4){ S.stale = true; S.staleAt = now; }
  }
  if(S.stale && now - S.staleAt > 400){ S.boxes = []; S.ref = null; S.stale = false; }
  maybeScan(now);
}
function maybeScan(now){
  if(!S.outlineOn || S.scanning || S.busy || now < S.scanPausedUntil) return;
  if(S.engine === 'local' && !LOCAL.odReady) return;
  if(S.forceScan){ S.forceScan = false; scan(); return; }
  if(S.boxes.length && !S.stale) return;
  if(!S.steadySince || now - S.steadySince < 700 || now - S.lastScan < 2500) return;
  scan();
}
function iouBox(a,b){
  const x1=Math.max(a[0],b[0]), y1=Math.max(a[1],b[1]), x2=Math.min(a[0]+a[2],b[0]+b[2]), y2=Math.min(a[1]+a[3],b[1]+b[3]);
  const i=Math.max(0,x2-x1)*Math.max(0,y2-y1); return i/((a[2]*a[3]+b[2]*b[3]-i)||1);
}
async function scan(){
  S.scanning = true; S.lastScan = performance.now();
  const ref = S.prev, vw = video.videoWidth, vh = video.videoHeight, c = smallCanvas(640);
  try{
    let raw = [];
    if(S.engine === 'local'){
      const k = vw / c.width;
      raw = (await gpu(() => localDetect(c))).map(o => ({ b:[o.x0*k, o.y0*k, (o.x1-o.x0)*k, (o.y1-o.y0)*k], label:o.label }));
    } else {
      const img = c.toDataURL('image/jpeg', 0.75).split(',')[1];
      const text = await callGemini(SCAN_MODEL, [{ role:'user', parts:[{ inline_data:{ mime_type:'image/jpeg', data:img } }, { text:SCAN_PROMPT }] }], { json:true });
      let arr = []; try{ arr = JSON.parse(text.replace(/```json|```/g,'').trim()); }catch(e){}
      raw = (Array.isArray(arr) ? arr : [])
        .filter(o => Array.isArray(o.box_2d) && o.box_2d.length === 4)
        .map(o => { const [y0,x0,y1,x1] = o.box_2d.map(Number); return { b:[x0/1000*vw, y0/1000*vh, (x1-x0)/1000*vw, (y1-y0)/1000*vh], label:String(o.label||'') }; });
    }
    // keep the biggest distinct ones, drop near-duplicates
    const kept = [];
    raw.filter(o => { const a = o.b[2]*o.b[3]/(vw*vh); return o.b[2] > 0 && o.b[3] > 0 && a > 0.004 && a < 0.9; })
       .sort((a,b) => b.b[2]*b.b[3] - a.b[2]*a.b[3])
       .forEach(o => { if(kept.length < 6 && kept.every(k2 => iouBox(k2.b, o.b) < 0.6)) kept.push(o); });
    const list = kept.sort((a,b) => a.b[0] - b.b[0]).map((o,i) => ({ ...o, color:COLORS[i] }));
    if(!S.busy){
      S.boxes = list; S.ref = ref; S.off = {x:0,y:0}; S.cur = {x:0,y:0}; S.disp = {x:0,y:0};
      S.stale = false; S.boxBorn = performance.now();
    }
  }catch(e){ console.error(e); if(e.status === 429) S.scanPausedUntil = performance.now() + 30000; }
  S.scanning = false;
}
function boxNow(o){
  const k = video.videoWidth / TW;
  return [o.b[0] + S.disp.x*k, o.b[1] + S.disp.y*k, o.b[2], o.b[3]];
}

/* ---------- Gemini ---------- */
const SYSTEM = `너는 사용자가 얼굴에 쓴 스마트글라스 속 AI 비서야.
사진은 사용자가 질문한 바로 그 순간 사용자의 눈앞 장면이야. 사진 정중앙에 있는 물건이 사용자가 "이것", "이거"라고 가리키는 대상이야.
보이는 것을 근거로 답하고, 확실하지 않으면 그렇다고 말해.
한국어로 1~3문장, 소리 내어 읽기 좋게 짧고 친근하게 답해. 이모지, 목록 기호, 마크다운은 쓰지 마.`;

async function ask(q){
  q = (q||'').trim(); if(!q || S.busy) return;
  try{ speechSynthesis.cancel(); }catch(e){} pending = 0; S.speaking = false;
  const useBoxes = S.boxes.length > 0 && !S.stale && COLOR_RE.test(q);
  const img = capture(useBoxes);
  if(!img){ toast('카메라 화면이 아직 준비되지 않았어요'); return; }
  S.busy = true; S.user = q; S.ai = '';
  let qText = q;
  if(useBoxes){
    qText += `\n[테두리 안내] 사진의 색 테두리는 앱이 그린 표시야. ` +
      S.boxes.map(o => `${o.color.name} 테두리(앱의 추정: ${o.label})`).join(', ') +
      `. 사용자가 색으로 부르면 그 색 테두리 안의 물체를 말하는 거야. 추정 이름은 틀릴 수 있으니 사진을 직접 보고 판단해.`;
  }
  let spoken = 0;
  const onText = text => {
    S.ai = text.replace(/[*#`]/g,'');
    const m = S.ai.slice(spoken).match(/^[\s\S]*?[.!?](\s|$)/);
    if(m && /\s$/.test(m[0])){ say(m[0]); spoken += m[0].length; }
  };
  try{
    if(S.engine === 'local'){
      if(!LOCAL.ready) throw new Error('폰 내장 AI가 아직 준비 중이에요. ' + S.status);
      const hint = useBoxes ? 'The app drew colored outlines: ' + S.boxes.map(o => `${COLOR_EN[o.color.name]} outline around a ${o.label || 'object'}`).join(', ') + '. ' : '';
      const prompt = `${hint}You are the assistant inside the user's smart glasses. The object in the exact center of the image is what the user means by "this". The user asks in Korean: "${q}". Answer in Korean in one or two short sentences.`;
      await gpu(() => localVlm(S.snap, prompt, onText));
    } else {
      const contents = [
        ...S.history.slice(-6),
        { role:'user', parts:[ { inline_data:{ mime_type:'image/jpeg', data:img } }, { text:qText } ] }
      ];
      await callGemini(S.model, contents, { stream:true, onText });
      S.history.push({ role:'user', parts:[{text:q}] }, { role:'model', parts:[{text:S.ai.trim()}] });
    }
    S.ai = S.ai.trim(); say(S.ai.slice(spoken));
  }catch(e){ console.error(e); S.ai = S.engine === 'local' && !/준비 중/.test(e.message||'') ? '폰 내장 AI가 답을 만들지 못했어요. ' + shortErr(e) : (e.message || String(e)); say(S.engine === 'local' ? '답을 만들지 못했어요.' : S.ai); }
  S.busy = false;
  if(!pending) afterSpeak();
}

async function callGemini(model, contents, { stream=false, json=false, onText }={}){
  const body = { contents, generationConfig:{ maxOutputTokens: json ? 600 : 300, temperature: json ? 0.2 : 0.5 } };
  if(!json) body.system_instruction = { parts:[{ text:SYSTEM }] };
  if(json) body.generationConfig.responseMimeType = 'application/json';
  if(!S.thinkOff) body.generationConfig.thinkingConfig = { thinkingLevel:'minimal' };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:` + (stream ? 'streamGenerateContent?alt=sse' : 'generateContent');
  const res = await fetch(url, {
    method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':S.key }, body:JSON.stringify(body)
  }).catch(() => { throw new Error('인터넷 연결을 확인해 주세요.'); });
  if(!res.ok){
    let msg = ''; try{ msg = (await res.json()).error?.message || ''; }catch(e){}
    if(res.status === 400 && /thinking/i.test(msg) && !S.thinkOff){ S.thinkOff = true; return callGemini(model, contents, { stream, json, onText }); }
    let err;
    if((res.status === 400 && /api key/i.test(msg)) || res.status === 401 || res.status === 403) err = new Error('API 키가 맞지 않아요. 설정에서 키를 확인해 주세요.');
    else if(res.status === 429) err = new Error('사용량 한도에 걸렸어요. 잠시 뒤에 다시 물어봐 주세요.');
    else if(res.status === 404) err = new Error('모델을 찾지 못했어요. 설정에서 다른 모델을 골라 주세요.');
    else err = new Error('AI가 응답하지 못했어요. (' + res.status + ')');
    err.status = res.status; throw err;
  }
  const pick = j => (j.candidates?.[0]?.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
  if(!stream) return pick(await res.json());
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '';
  while(true){
    const { done, value } = await reader.read(); if(done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
      if(!line.startsWith('data:')) continue;
      try{ text += pick(JSON.parse(line.slice(5))); onText?.(text); }catch(e){}
    }
  }
  if(!text.trim()) throw new Error('대답이 비어 있어요. 다시 물어봐 주세요.');
  return text;
}

/* ---------- voice in / out ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let pending = 0;
function say(t){
  t = (t||'').trim();
  if(!S.voiceOn || !('speechSynthesis' in window) || !t) return;
  const hangul = (t.match(/[가-힣]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
  const u = new SpeechSynthesisUtterance(t); u.lang = hangul >= latin*0.3 ? 'ko-KR' : 'en-US'; u.rate = 1.08;
  pending++; S.speaking = true;
  u.onend = u.onerror = () => { if(--pending <= 0){ pending = 0; S.speaking = false; if(!S.busy) afterSpeak(); } };
  speechSynthesis.speak(u);
}
function afterSpeak(){ if(S.handsfree) setTimeout(listen, 400); }
function listen(){
  if(!SR){ toast('이 브라우저는 음성 인식을 지원하지 않아요'); return; }
  if(S.listening || S.speaking || S.busy) return;
  const r = new SR(); r.lang = 'ko-KR'; r.interimResults = true; r.continuous = false;
  S.rec = r; S.finalText = ''; S.user = '';
  r.onresult = e => {
    let t = ''; for(const res of e.results) t += res[0].transcript;
    S.user = t; if(e.results[e.results.length-1].isFinal) S.finalText = t;
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ S.handsfree = false; $('#hf').setAttribute('aria-pressed', false); toast('마이크 권한을 허용해 주세요'); }
  };
  r.onend = () => {
    S.listening = false; $('#mic').classList.remove('on');
    const t = S.finalText || '';
    if(t) ask(t); else if(S.handsfree) setTimeout(listen, 300);
  };
  try{ r.start(); S.listening = true; $('#mic').classList.add('on'); }catch(e){}
}
function stopListening(){ try{ S.rec?.abort(); }catch(e){} S.listening = false; $('#mic').classList.remove('on'); }

/* ---------- controls ---------- */
$('#mic').onclick = () => S.listening ? stopListening() : listen();
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter'){ ask(e.target.value); e.target.value=''; e.target.blur(); } });
$('#look').onclick = () => ask('이게 뭐야?');
$('#read').onclick = () => ask('보이는 글자를 읽어 줘.');
$('#outline').onclick = e => { S.outlineOn = !S.outlineOn; e.currentTarget.setAttribute('aria-pressed', S.outlineOn); if(!S.outlineOn){ S.boxes = []; S.ref = null; } };
$('#rescan').onclick = () => { S.boxes = []; S.ref = null; S.outlineOn = true; $('#outline').setAttribute('aria-pressed', true); S.forceScan = true; toast('윤곽을 다시 찾을게요'); };
$('#hf').onclick = e => { S.handsfree = !S.handsfree; e.currentTarget.setAttribute('aria-pressed', S.handsfree); if(S.handsfree) listen(); else stopListening(); };
$('#voice').onclick = e => { S.voiceOn = !S.voiceOn; e.currentTarget.setAttribute('aria-pressed', S.voiceOn); if(!S.voiceOn){ speechSynthesis.cancel(); pending = 0; S.speaking = false; } };
$('#stereoBtn').onclick = () => { S.stereo = true; applyStereo(); };
$('#flip').onclick = async () => { S.facing = S.facing === 'environment' ? 'user' : 'environment'; try{ await openCamera(); }catch(e){ toast('카메라를 바꾸지 못했어요'); } };
$('#back').onclick = () => {
  stopListening(); S.handsfree = false; $('#hf').setAttribute('aria-pressed', false);
  S.stream?.getTracks().forEach(t=>t.stop());
  $('#live').style.display = 'none'; $('#setup').style.display = 'flex';
  try{ document.exitFullscreen?.(); }catch(e){}
};
let pressT = 0, pressTimer = null;
cv.addEventListener('pointerdown', () => { pressT = Date.now(); pressTimer = setTimeout(() => { if(S.stereo){ S.stereo = false; applyStereo(); toast('한 화면으로 돌아왔어요'); } }, 700); });
cv.addEventListener('pointerup', () => {
  clearTimeout(pressTimer);
  if(Date.now() - pressT < 700 && S.stereo){ S.listening ? stopListening() : listen(); }
});

/* ---------- rendering ---------- */
function render(){
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  if(S.stereo){
    const gap = Math.round(W*0.012), ew = Math.floor((W-gap)/2);
    drawEye(0, 0, ew, H); drawEye(ew+gap, 0, ew, H);
  } else drawEye(0, 0, W, H);
  if($('#live').style.display !== 'none') requestAnimationFrame(render); else S.running = false;
}
function drawEye(x, y, w, h){
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const vw = video.videoWidth, vh = video.videoHeight, mirror = S.facing === 'user';
  const u = Math.min(w,h)/100, now = performance.now();
  if(vw){
    const s = Math.max(w/vw, h/vh), dw = vw*s, dh = vh*s, dx = x+(w-dw)/2, dy = y+(h-dh)/2;
    if(mirror){ ctx.save(); ctx.translate(x*2+w,0); ctx.scale(-1,1); ctx.drawImage(video, dx, dy, dw, dh); ctx.restore(); }
    else ctx.drawImage(video, dx, dy, dw, dh);
  }
  // color outlines
  if(vw && S.boxes.length){
    const s = Math.max(w/vw, h/vh), dx = x+(w-vw*s)/2, dy = y+(h-vh*s)/2;
    S.disp.x += (S.cur.x - S.disp.x)*0.35; S.disp.y += (S.cur.y - S.disp.y)*0.35;
    const a = S.stale ? Math.max(0, 1 - (now - S.staleAt)/400) : Math.min(1, (now - S.boxBorn)/250);
    ctx.globalAlpha = a;
    for(const o of S.boxes){
      let [bx,by,bw,bh] = boxNow(o);
      if(mirror) bx = vw - bx - bw;
      const rx = dx + bx*s, ry = dy + by*s, rw = bw*s, rh = bh*s, rr = Math.min(rw,rh)*0.08;
      ctx.fillStyle = o.color.hex + '1A'; roundRect(rx, ry, rw, rh, rr); ctx.fill();
      ctx.lineWidth = Math.max(2, u*0.6); ctx.strokeStyle = o.color.hex;
      ctx.shadowColor = o.color.hex; ctx.shadowBlur = u*1.5;
      roundRect(rx, ry, rw, rh, rr); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
  // shutter flash
  const fa = 1 - (now - S.flash)/250;
  if(fa > 0){ ctx.fillStyle = `rgba(255,255,255,${fa*0.5})`; ctx.fillRect(x,y,w,h); }
  // reticle
  const cx = x+w/2, cy = y+h/2, r = u*3.2;
  ctx.strokeStyle = '#fff'; ctx.globalAlpha = S.busy ? 1 : 0.85; ctx.lineWidth = Math.max(1.5, u*(S.busy ? 0.6 : 0.35));
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-r*1.8, cy); ctx.lineTo(cx-r*1.2, cy); ctx.moveTo(cx+r*1.2, cy); ctx.lineTo(cx+r*1.8, cy);
  ctx.moveTo(cx, cy-r*1.8); ctx.lineTo(cx, cy-r*1.2); ctx.moveTo(cx, cy+r*1.2); ctx.lineTo(cx, cy+r*1.8);
  ctx.stroke();
  ctx.globalAlpha = 1;
  drawHud(x, y, w, h, u, now);
  ctx.restore();
}
function drawHud(x, y, w, h, u, now){
  const dpr = S.dpr;
  const padX = S.stereo ? w*0.14 : 14*dpr;
  const top = S.stereo ? h*0.12 : (S.safeTop+12)*dpr;
  const fs = S.stereo ? Math.round(u*4.6) : Math.round(16*dpr);
  ctx.textBaseline = 'top';

  ctx.font = `600 ${Math.round(fs*0.8)}px "IBM Plex Sans KR", sans-serif`;
  const state = S.listening ? '듣는 중' : S.busy ? (S.ai ? '대답 중' : '보는 중') : '';
  const outline = !S.outlineOn ? '' : S.scanning ? '윤곽 찾는 중' : performance.now() < S.scanPausedUntil ? '윤곽 잠시 쉼' : '';
  const chips = [state, S.status, outline].filter(Boolean);
  let cx = x + padX;
  chips.forEach((t,i) => {
    const tw = ctx.measureText(t).width, ph = fs*1.5, live = i === 0 && !!state;
    ctx.fillStyle = live ? '#FFCE3A' : 'rgba(8,14,24,.62)';
    roundRect(cx, y+top, tw+fs, ph, ph/2); ctx.fill();
    ctx.fillStyle = live ? '#1A1400' : '#fff';
    ctx.fillText(t, cx+fs/2, y+top+ph*0.2);
    cx += tw + fs*1.4;
  });

  // thumbnail of what the AI saw
  if(S.snap && (S.busy || S.speaking || now - S.snapAt < 6000)){
    const tw = Math.min(w*0.26, 180*dpr), th = tw * S.snap.height / S.snap.width;
    const tx = x + w - padX - tw, ty = y + top;
    ctx.fillStyle = '#FFCE3A'; roundRect(tx-3, ty-3, tw+6, th+6, 8); ctx.fill();
    ctx.drawImage(S.snap, tx, ty, tw, th);
  }

  const bottomGap = S.stereo ? h*0.14 : ((document.getElementById('bar').offsetHeight||130) + 10) * dpr;
  const maxW = w - padX*2;
  ctx.font = `400 ${fs}px "IBM Plex Sans KR", sans-serif`;
  const lh = fs*1.45;
  let lines = [];
  if(S.user) wrap('나: ' + S.user, maxW - fs*1.4).slice(0,2).forEach(t => lines.push({t, c:'rgba(255,255,255,.7)'}));
  if(S.ai) wrap(S.ai, maxW - fs*1.4).forEach(t => lines.push({t, c:'#fff'}));
  if(!lines.length) return;
  const maxLines = S.stereo ? 4 : 6;
  if(lines.length > maxLines) lines = lines.slice(-maxLines);
  const ph = lines.length*lh + fs*1.1, py = y + h - bottomGap - ph;
  ctx.fillStyle = 'rgba(8,14,24,.66)'; roundRect(x+padX, py, maxW, ph, fs*0.6); ctx.fill();
  ctx.fillStyle = '#FFCE3A'; ctx.fillRect(x+padX, py+fs*0.5, Math.max(2, u*0.5), ph-fs);
  lines.forEach((l,i) => { ctx.fillStyle = l.c; ctx.fillText(l.t, x+padX+fs*0.8, py+fs*0.55+i*lh); });
}
function wrap(text, maxW){
  const out = []; let line = '';
  for(const ch of text.replace(/\s+/g,' ')){
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line){
      const sp = line.lastIndexOf(' ');
      if(sp > line.length*0.5){ out.push(line.slice(0,sp)); line = line.slice(sp+1) + ch; }
      else { out.push(line); line = ch; }
    } else line = test;
  }
  if(line) out.push(line);
  return out;
}
function roundRect(x,y,w,h,r,c=ctx){ r = Math.max(0, Math.min(r, w/2, h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
